<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieStar</title>
  <style>
    :root {
      --bg: #000;
      --panel: #111;
      --text: #fff;
      --muted: rgba(255,255,255,0.75);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    .panel {
      width: 100%;
      max-width: 960px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 30px;
    }

    p {
      margin: 0 0 18px 0;
      color: var(--muted);
      line-height: 1.4;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 18px;
      cursor: pointer;
    }

    #scan-btn {
      margin-top: 8px;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 18px auto 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: var(--panel);
      display: none;
    }

    #scan-status,
    #player-status {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      min-height: 20px;
    }

    #player-wrap {
      width: 92vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      position: relative;
      background: #000;
      margin: 18px auto 0 auto;
      border-radius: 16px;
      display: none;
    }

    /* Oberen Bereich abschneiden, damit YouTube-Titel möglichst verborgen bleibt */
    #player {
      position: absolute;
      left: 0;
      top: -100px;
      width: 100%;
      height: calc(100% + 200px);
    }

    .small {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .code-box {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      word-break: break-word;
    }
  </style>
</head>
<body>
  <section id="scan-screen" class="screen active">
    <div class="panel">
      <h1>Bereit für die nächste Karte?</h1>
      <p>Tippe auf den Button, um den Scanner zu öffnen.</p>

      <button id="scan-btn">Nächste Karte scannen</button>

      <div id="reader"></div>
      <div id="scan-status"></div>
      <div class="small">Beim ersten Mal musst du der Kamera den Zugriff erlauben.</div>
    </div>
  </section>

  <section id="play-screen" class="screen">
    <div class="panel">
      <h1>Bereit für den Trailer?</h1>
      <p>Tippe auf den Button, um den Clip zu starten.</p>

      <button id="start-btn">Trailer abspielen</button>

      <div id="player-wrap">
        <div id="player"></div>
      </div>

      <div id="player-status"></div>
      <div id="current-code" class="code-box"></div>
    </div>
  </section>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /*
      Hier deine Filme eintragen.
      Format:
      "m001": { videoId: "YOUTUBE_ID" },
    */
    const MOVIES = {
      "m001": { videoId: "aNQqoExfQsg" },
      "m002": { videoId: "YoHD9XEInc0" },
      "m003": { videoId: "EXeTwQWrcwY" }
      // "m004": { videoId: "XXXXXXXXXXX" },
      // "m005": { videoId: "YYYYYYYYYYY" }
    };

    const DEFAULT_START = 25;
    const DEFAULT_END = 40;

    const scanScreen = document.getElementById("scan-screen");
    const playScreen = document.getElementById("play-screen");
    const readerEl = document.getElementById("reader");
    const scanStatus = document.getElementById("scan-status");
    const playerStatus = document.getElementById("player-status");
    const scanBtn = document.getElementById("scan-btn");
    const startBtn = document.getElementById("start-btn");
    const playerWrap = document.getElementById("player-wrap");
    const currentCodeEl = document.getElementById("current-code");

    let html5QrCode = null;
    let scannerRunning = false;
    let isHandlingScan = false;

    let player = null;
    let ytReady = false;
    let currentMovie = null;
    let currentCode = null;
    let stopCheck = null;

    function showScreen(name) {
      scanScreen.classList.toggle("active", name === "scan");
      playScreen.classList.toggle("active", name === "play");
    }

    function onYouTubeIframeAPIReady() {
      ytReady = true;
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    async function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (scannerRunning) return;

      readerEl.style.display = "block";
      scanBtn.style.display = "none";

      try {
        scanStatus.textContent = "Kamera aktiv. QR-Code scannen.";

        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScanSuccess,
          () => {}
        );

        scannerRunning = true;
      } catch (err) {
        console.error(err);
        scanStatus.textContent = "Kamera konnte nicht gestartet werden. Prüfe die Browser-Berechtigung.";
        scanBtn.style.display = "inline-block";
      }
    }

    async function stopScanner() {
      if (!html5QrCode || !scannerRunning) return;

      try {
        await html5QrCode.stop();
      } catch (err) {
        console.error(err);
      }

      scannerRunning = false;
    }

    async function onScanSuccess(decodedText) {
      if (isHandlingScan) return;

      const code = decodedText.trim();
      const movie = MOVIES[code];

      if (!movie) {
        scanStatus.textContent = `Unbekannter Code: ${code}`;
        return;
      }

      isHandlingScan = true;
      currentMovie = movie;
      currentCode = code;

      scanStatus.textContent = `Karte erkannt: ${code}`;

      await stopScanner();

      readerEl.style.display = "none";
      playerWrap.style.display = "none";
      startBtn.style.display = "inline-block";
      playerStatus.textContent = "";
      currentCodeEl.textContent = `Code: ${code}`;

      showScreen("play");
      isHandlingScan = false;
    }

    function destroyPlayer() {
      if (stopCheck) {
        clearInterval(stopCheck);
        stopCheck = null;
      }

      if (player && typeof player.destroy === "function") {
        player.destroy();
      }

      player = null;
      document.getElementById("player").innerHTML = "";
    }

    function resetScanScreen() {
      readerEl.style.display = "none";
      scanBtn.style.display = "inline-block";
      scanStatus.textContent = "";
    }

    function backToScanner() {
      destroyPlayer();
      currentMovie = null;
      currentCode = null;
      playerWrap.style.display = "none";
      startBtn.style.display = "inline-block";
      playerStatus.textContent = "";
      currentCodeEl.textContent = "";
      showScreen("scan");
      resetScanScreen();
    }

    function createPlayerAndPlay() {
      if (!ytReady || !currentMovie) return;

      playerWrap.style.display = "block";
      playerStatus.textContent = "Trailer wird geladen ...";

      player = new YT.Player("player", {
        videoId: currentMovie.videoId,
        playerVars: {
          start: DEFAULT_START,
          controls: 0,
          rel: 0,
          playsinline: 1,
          modestbranding: 1,
          fs: 0,
          disablekb: 1
        },
        events: {
          onReady: function () {
            playerStatus.textContent = "";
            player.seekTo(DEFAULT_START, true);
            player.playVideo();
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              if (stopCheck) clearInterval(stopCheck);

              stopCheck = setInterval(() => {
                const t = player.getCurrentTime();

                if (t >= DEFAULT_END) {
                  clearInterval(stopCheck);
                  stopCheck = null;
                  player.pauseVideo();

                  setTimeout(() => {
                    backToScanner();
                  }, 700);
                }
              }, 200);
            }

            if (event.data === YT.PlayerState.ENDED) {
              if (stopCheck) clearInterval(stopCheck);
              stopCheck = null;

              setTimeout(() => {
                backToScanner();
              }, 700);
            }
          }
        }
      });
    }

    scanBtn.addEventListener("click", () => {
      startScanner();
    });

    startBtn.addEventListener("click", () => {
      if (!currentMovie) return;

      startBtn.style.display = "none";
      destroyPlayer();
      createPlayerAndPlay();
    });

    window.addEventListener("load", () => {
      resetScanScreen();
    });
  </script>
</body>
</html>
