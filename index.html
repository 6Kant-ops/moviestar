<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieStar</title>
  <style>
    :root {
      --bg: #000;
      --panel: #111;
      --text: #fff;
      --muted: rgba(255,255,255,0.75);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    .panel {
      width: 100%;
      max-width: 960px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 30px;
    }

    p {
      margin: 0 0 18px 0;
      color: var(--muted);
      line-height: 1.4;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 18px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 18px auto 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: var(--panel);
      display: none;
    }

    #scan-status,
    #player-status {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      min-height: 20px;
    }

    #player-wrap {
      width: 92vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      position: relative;
      background: #000;
      margin: 18px auto 0 auto;
      border-radius: 16px;
      display: none;
    }

    #player {
      position: absolute;
      left: 0;
      top: -100px;
      width: 100%;
      height: calc(100% + 200px);
    }

    .small {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .code-box {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      word-break: break-word;
    }
  </style>
</head>
<body>
  <section id="scan-screen" class="screen active">
    <div class="panel">
      <h1>Bereit für die nächste Karte?</h1>
      <p>Tippe auf den Button, um den Scanner zu öffnen.</p>

      <button id="scan-btn">Nächste Karte scannen</button>

      <div id="reader"></div>
      <div id="scan-status"></div>
      <div class="small">Beim ersten Mal musst du der Kamera den Zugriff erlauben.</div>
    </div>
  </section>

  <section id="play-screen" class="screen">
    <div class="panel">
      <h1>Bereit für den Trailer?</h1>
      <p>Tippe auf den Button, um den Clip zu starten.</p>

      <button id="start-btn">Trailer abspielen</button>

      <div id="player-wrap">
        <div id="player"></div>
      </div>

      <div id="player-status"></div>
      <div id="current-code" class="code-box"></div>
    </div>
  </section>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

    };

    const DEFAULT_START = 25;
    const DEFAULT_END = 40;

    const scanScreen = document.getElementById("scan-screen");
    const playScreen = document.getElementById("play-screen");
    const scanBtn = document.getElementById("scan-btn");
    const startBtn = document.getElementById("start-btn");
    const readerEl = document.getElementById("reader");
    const scanStatus = document.getElementById("scan-status");
    const playerWrap = document.getElementById("player-wrap");
    const playerStatus = document.getElementById("player-status");
    const currentCodeEl = document.getElementById("current-code");

    let html5QrCode = null;
    let scannerRunning = false;
    let handlingScan = false;

    let ytReady = false;
    let player = null;
    let stopCheck = null;
    let currentMovie = null;
    let currentCode = null;
    let pendingPlayAfterReady = false;

    function showScreen(name) {
      scanScreen.classList.toggle("active", name === "scan");
      playScreen.classList.toggle("active", name === "play");
    }

    function resetScanScreen() {
      readerEl.style.display = "none";
      scanBtn.style.display = "inline-block";
      scanStatus.textContent = "";
    }

    function onYouTubeIframeAPIReady() {
      ytReady = true;
      if (pendingPlayAfterReady && currentMovie) {
        pendingPlayAfterReady = false;
        function createPlayerAndPlay() {
  if (!currentMovie) return;

  if (!ytReady) {
    playerStatus.textContent = "Player wird vorbereitet ...";
    pendingPlayAfterReady = true;
    return;
  }

  pendingPlayAfterReady = false;

  // Player erstmal verstecken (kein Thumbnail sichtbar)
  playerWrap.style.display = "block";
  playerWrap.style.visibility = "hidden";

  playerStatus.textContent = "";

  player = new YT.Player("player", {
    videoId: currentMovie.videoId,
    playerVars: {
      start: DEFAULT_START,
      autoplay: 1,
      controls: 0,
      rel: 0,
      playsinline: 1,
      modestbranding: 1,
      fs: 0,
      disablekb: 1
    },
    events: {
      onReady: function () {
        player.seekTo(DEFAULT_START, true);
        player.playVideo();
      },
      onStateChange: function (event) {

        // Sobald Video wirklich läuft → sichtbar machen
        if (event.data === YT.PlayerState.PLAYING) {
          playerWrap.style.visibility = "visible";

          if (stopCheck) clearInterval(stopCheck);

          stopCheck = setInterval(() => {
            const t = player.getCurrentTime();

            if (t >= DEFAULT_END) {
              clearInterval(stopCheck);
              stopCheck = null;
              player.pauseVideo();

              setTimeout(() => {
                backToScanner();
              }, 700);
            }
          }, 200);
        }

        if (event.data === YT.PlayerState.ENDED) {
          if (stopCheck) clearInterval(stopCheck);
          stopCheck = null;

          setTimeout(() => {
            backToScanner();
          }, 700);
        }
      }
    }
  });
}
      }
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    async function ensureScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
    }

    async function startScanner() {
      await ensureScanner();
      if (scannerRunning) return;

      readerEl.style.display = "block";
      scanBtn.style.display = "none";
      scanStatus.textContent = "Kamera wird gestartet ...";

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 220, height: 220 },
            aspectRatio: 1.0
          },
          onScanSuccess,
          () => {}
        );

        scannerRunning = true;
        scanStatus.textContent = "Kamera aktiv. QR-Code scannen.";
      } catch (err) {
        console.error("Scanner start error:", err);
        scanStatus.textContent = "Kamera konnte nicht gestartet werden. Prüfe Safari-Berechtigungen.";
        readerEl.style.display = "none";
        scanBtn.style.display = "inline-block";
      }
    }

    async function stopScanner() {
      if (!html5QrCode || !scannerRunning) return;

      try {
        await html5QrCode.stop();
      } catch (err) {
        console.error("Scanner stop error:", err);
      }

      scannerRunning = false;
    }

    async function onScanSuccess(decodedText) {
      if (handlingScan) return;
      handlingScan = true;

      const code = decodedText.trim();
      const movie = MOVIES[code];

      if (!movie) {
        scanStatus.textContent = `Unbekannter Code: ${code}`;
        handlingScan = false;
        return;
      }

      currentMovie = movie;
      currentCode = code;
      scanStatus.textContent = `Karte erkannt: ${code}`;

      await stopScanner();

      readerEl.style.display = "none";
      startBtn.style.display = "inline-block";
      playerWrap.style.display = "none";
      playerStatus.textContent = "";
      currentCodeEl.textContent = `Code: ${code}`;

      showScreen("play");
      handlingScan = false;
    }

    function destroyPlayer() {
      if (stopCheck) {
        clearInterval(stopCheck);
        stopCheck = null;
      }

      if (player && typeof player.destroy === "function") {
        player.destroy();
      }

      player = null;
      document.getElementById("player").innerHTML = "";
    }

    function backToScanner() {
      destroyPlayer();
      currentMovie = null;
      currentCode = null;
      playerWrap.style.display = "none";
      startBtn.style.display = "inline-block";
      playerStatus.textContent = "";
      currentCodeEl.textContent = "";
      showScreen("scan");
      resetScanScreen();
    }

    function createPlayerAndPlay() {
      if (!currentMovie) return;

      if (!ytReady) {
        playerStatus.textContent = "Player wird vorbereitet ...";
        pendingPlayAfterReady = true;
        return;
      }

      pendingPlayAfterReady = false;
      playerWrap.style.display = "block";
      playerStatus.textContent = "Trailer wird geladen ...";

      player = new YT.Player("player", {
        videoId: currentMovie.videoId,
        playerVars: {
          start: DEFAULT_START,
          autoplay: 1,
          controls: 0,
          rel: 0,
          playsinline: 1,
          modestbranding: 1,
          fs: 0,
          disablekb: 1
        },
        events: {
          onReady: function () {
            playerStatus.textContent = "";
            player.seekTo(DEFAULT_START, true);
            player.playVideo();
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              if (stopCheck) clearInterval(stopCheck);

              stopCheck = setInterval(() => {
                const t = player.getCurrentTime();
                if (t >= DEFAULT_END) {
                  clearInterval(stopCheck);
                  stopCheck = null;
                  player.pauseVideo();

                  setTimeout(() => {
                    backToScanner();
                  }, 700);
                }
              }, 200);
            }

            if (event.data === YT.PlayerState.ENDED) {
              if (stopCheck) clearInterval(stopCheck);
              stopCheck = null;

              setTimeout(() => {
                backToScanner();
              }, 700);
            }
          }
        }
      });
    }

    scanBtn.addEventListener("click", async () => {
      await startScanner();
    });

    startBtn.addEventListener("click", () => {
      if (!currentMovie) return;

      startBtn.style.display = "none";
      destroyPlayer();
      createPlayerAndPlay();
    });

    window.addEventListener("load", () => {
      resetScanScreen();
    });
  </script>

</html>
