<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trailer</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    #start {
      margin-bottom: 20px;
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    /* Sichtbarer Ausschnitt */
    #player-wrap {
      width: 90vw;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    /* Der echte YouTube-Player wird grösser gemacht und nach oben geschoben */
    #player {
      position: absolute;
      left: 0;
      top: -60px;      /* hier schneidest du oben etwas ab */
      width: 100%;
      height: calc(100% + 120px); /* mehr Höhe, damit unten kein schwarzer Balken entsteht */
    }
  </style>
</head>
<body>
  <button id="start">Trailer starten</button>

  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const params = new URLSearchParams(window.location.search);

    const videoId = params.get("v");
    const start = Number(params.get("s") || 15);
    const end = Number(params.get("e") || 40);

    let player;
    let stopCheck;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: videoId,
        playerVars: {
          start: start,
          controls: 0,
          rel: 0,
          playsinline: 1,
          modestbranding: 1
        },
        events: {
          onReady: function () {},
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              clearInterval(stopCheck);

              stopCheck = setInterval(() => {
                const current = player.getCurrentTime();

                if (current >= end) {
                  clearInterval(stopCheck);
                  player.pauseVideo();
                  window.location.href = "next.html";
                }
              }, 200);
            }
          }
        }
      });
    }

    document.getElementById("start").addEventListener("click", () => {
      if (!player) return;
      player.seekTo(start, true);
      player.playVideo();
      document.getElementById("start").style.display = "none";
    });
  </script>
</body>
</html>
