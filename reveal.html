<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auflösung</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      max-width: 700px;
      width: 100%;
      background: #1b1b1b;
      padding: 32px;
      border-radius: 18px;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .year {
      font-size: 22px;
      opacity: 0.85;
    }

    .small {
      margin-top: 24px;
      opacity: 0.7;
      font-size: 14px;
    }

    a.button {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 18px;
      border-radius: 12px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Unbekannter Film</h1>
    <div class="year" id="year">Jahr unbekannt</div>
    <a id="again" class="button" href="#">Nochmal ansehen</a>
    <div class="small">Diese Seite zeigt erst nach dem Clip die Auflösung.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title") || "Unbekannter Film";
    const year = params.get("year") || "Jahr unbekannt";
    const back = params.get("back") || "javascript:history.back()";

    document.getElementById("title").textContent = title;
    document.getElementById("year").textContent = year;
    document.getElementById("again").href = back;
  </script>
</body>
</html>
